[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffapply"
version = "0.1.0"
description = "Robustly apply LLM-emitted edits — Aider-style SEARCH/REPLACE blocks and unified diffs — with tolerant fuzzy context matching, stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amarel Taylor Scott" }]
keywords = ["llm", "diff", "patch", "unified-diff", "search-replace", "agents", "codegen", "apply"]
dependencies = []

[project.scripts]
diffapply = "diffapply.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["diffapply"]
